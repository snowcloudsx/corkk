<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet Proxy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #frame { width: 100vw; height: 100vh; border: none; display: block; background: #000; }
        #settings-popup {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); background: rgba(20, 20, 20, 0.98);
            color: white; padding: 30px; border-radius: 8px; z-index: 10000;
            min-width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        }
        #settings-popup.active { display: block; }
        #settings-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 9999;
        }
        #settings-overlay.active { display: block; }
        #settings-popup h2 { margin-bottom: 20px; font-size: 18px; font-weight: 600; }
        .settings-group { margin-bottom: 18px; }
        .settings-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #bbb; }
        .settings-group select {
            width: 100%; padding: 9px; background: #333; color: white;
            border: 1px solid #555; border-radius: 4px; font-size: 13px;
        }
        .close-btn {
            margin-top: 8px; padding: 9px 16px; background: #555; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .close-btn:hover { background: #666; }
    </style>
</head>
<body>
    <iframe id="frame"></iframe>

    <div id="settings-overlay"></div>
    <div id="settings-popup">
        <h2>Settings</h2>
        <div class="settings-group">
            <label for="proxyBackend">Proxy Backend</label>
            <select id="proxyBackend">
                <option value="libcurl">libcurl</option>
                <option value="epoxy">epoxy</option>
            </select>
        </div>
        <button class="close-btn" onclick="closeSettings()">Close</button>
    </div>

    <script src="/bootstrap-init.js"></script>
    <script>
        let controller, frame;

        function getSettings() {
            let transport = "libcurl";
            try { transport = localStorage.getItem("proxy_backend") || transport; } catch (e) {}
            return { transport };
        }

        async function init() {
            const s = getSettings();
            controller = await initBootstrap({
                transport: s.transport,
            });
            frame = controller.createFrame(document.getElementById("frame"));
            await frame.go("https://cork7.com/");
        }

        init().catch((e) => console.error("Init failed:", e));

        const settingsPopup = document.getElementById('settings-popup');
        const settingsOverlay = document.getElementById('settings-overlay');
        const proxyBackendSelect = document.getElementById('proxyBackend');

        const savedBackend = localStorage.getItem('proxy_backend') || 'libcurl';
        proxyBackendSelect.value = savedBackend;

        proxyBackendSelect.addEventListener('change', (e) => {
            localStorage.setItem('proxy_backend', e.target.value);
            console.log('Proxy backend changed to:', e.target.value);
            alert('Reload the page to apply the new backend.');
        });

        function openSettings() {
            settingsPopup.classList.add('active');
            settingsOverlay.classList.add('active');
        }
        function closeSettings() {
            settingsPopup.classList.remove('active');
            settingsOverlay.classList.remove('active');
        }
        settingsOverlay.addEventListener('click', closeSettings);

        document.addEventListener('keydown', (e) => {
            if (e.key === '/') {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                e.preventDefault();
                openSettings();
            }
            if (e.key === 'Escape') closeSettings();
        });
    </script>
</body>
</html>
